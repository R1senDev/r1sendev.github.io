        function init() {
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width;
            canvas.height = height;
            if (img.complete) create(); else img.onload = create;
        }

        function create() {
            particles = [];
            const tCanvas = document.createElement('canvas');
            tCanvas.width = width; tCanvas.height = height;
            const tCtx = tCanvas.getContext('2d');

            const aspect = img.width / img.height;
            const cAspect = width / height;
            let dw, dh, ox, oy;
            if (cAspect > aspect) { dw = width; dh = width / aspect; ox = 0; oy = (height - dh) / 2; }
            else { dw = height * aspect; dh = height; ox = (width - dw) / 2; oy = 0; }

            tCtx.drawImage(img, ox, oy, dw, dh);
            const data = tCtx.getImageData(0, 0, width, height).data;

            for (let y = 0; y < height; y += step) {
                for (let x = 0; x < width; x += step) {
                    const i = (Math.floor(y) * width + Math.floor(x)) * 4;
                    if (i >= data.length) continue;
                    particles.push({
                        hx: x, hy: y, x: 0, y: 0, vx: 0, vy: 0,
                        tr: data[i], tg: data[i+1], tb: data[i+2],
                        br: 0, bg: 0, bb: 0, prg: 0, a: false
                    });
                }
            }
        }

        let drawing = false;
        const handle = (e) => {
            if (!drawing) return;
            const r = canvas.getBoundingClientRect();
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            const mx = cx - r.left, my = cy - r.top;
            
            const rad = parseInt(sizePicker.value);
            const hex = colorPicker.value;
            const cr = parseInt(hex.slice(1,3), 16), cg = parseInt(hex.slice(3,5), 16), cb = parseInt(hex.slice(5,7), 16);

            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                const dx = p.hx - mx, dy = p.hy - my;
                if (dx*dx + dy*dy < rad*rad) {
                    if (!p.active && !p.a) {
                        p.a = true; p.x = mx; p.y = my;
                        p.br = cr; p.bg = cg; p.bb = cb;
                        p.prg = 0;
                    }
                }
            }
        };

        canvas.addEventListener('mousedown', (e) => { drawing = true; handle(e); });
        window.addEventListener('mouseup', () => drawing = false);
        canvas.addEventListener('mousemove', handle);
        canvas.addEventListener('touchstart', (e) => { drawing = true; handle(e); e.preventDefault(); }, {passive:false});
        canvas.addEventListener('touchmove', (e) => { handle(e); e.preventDefault(); }, {passive:false});

        resetBtn.onclick = () => particles.forEach(p => p.a = false);
        window.addEventListener('resize', init);

        function loop() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);
            
            const pLen = particles.length;
            for (let i = 0; i < pLen; i++) {
                const p = particles[i];
                if (!p.a) continue;

                p.vx += (p.hx - p.x) * 0.009;
                p.vy += (p.hy - p.y) * 0.009;
                p.vx *= 0.85; p.vy *= 0.85;
                p.x += p.vx; p.y += p.vy;

                if (p.prg < TARGET_PROGRESS) p.prg += PROGRESS_INC;
                const r = (p.br + (p.tr - p.br) * p.prg) | 0;
                const g = (p.bg + (p.tg - p.bg) * p.prg) | 0;
                const b = (p.bb + (p.tb - p.bb) * p.prg) | 0;

                ctx.fillStyle = "rgb(" + r + "," + g + "," + b + ")";
                // OVERLAP for seamless look
                ctx.fillRect(p.x - 0.3, p.y - 0.3, step + 0.6, step + 0.6);
            }
            requestAnimationFrame(loop);
        }

        init();
        requestAnimationFrame(loop);
    </script>
